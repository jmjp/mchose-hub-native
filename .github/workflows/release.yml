name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Package (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: macos-latest
            platform: macos-x86_64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libudev-dev libxkbcommon-dev libwayland-dev libx11-xcb-dev \
            libasound2-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/mchose-hub-native.exe dist/
          Copy-Item README.md, LICENSE, NOTICE.md dist/
          Compress-Archive -Path dist/* -DestinationPath "mchose-hub-native-${{ matrix.platform }}.zip"
          # Raw (archive-free) binary for direct download.
          Copy-Item target/release/mchose-hub-native.exe "mchose-hub-native-${{ matrix.platform }}.exe"

      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/release/mchose-hub-native dist/
          cp README.md LICENSE NOTICE.md dist/
          tar -czf "mchose-hub-native-${{ matrix.platform }}.tar.gz" -C dist .
          # Raw (archive-free) binary for direct download; executable bit preserved here,
          # but GitHub release downloads do not preserve permissions (chmod +x needed).
          cp target/release/mchose-hub-native "mchose-hub-native-${{ matrix.platform }}"
          chmod +x "mchose-hub-native-${{ matrix.platform }}"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: mchose-hub-native-${{ matrix.platform }}
          path: |
            mchose-hub-native-${{ matrix.platform }}.zip
            mchose-hub-native-${{ matrix.platform }}.tar.gz
            mchose-hub-native-${{ matrix.platform }}.exe
            mchose-hub-native-${{ matrix.platform }}
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: mchose-hub-native-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          : > SHA256SUMS.txt
          for f in *; do
            if [ "$f" != "SHA256SUMS.txt" ] && [ -f "$f" ]; then
              sha256sum "$f" >> SHA256SUMS.txt
            fi
          done
          cat SHA256SUMS.txt

      - name: List artifacts
        run: ls -la dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
