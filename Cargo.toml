[package]
name = "mchose-hub-native"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
description = "Native Rust/egui companion app for MCHOSE headsets — a WebView-free reimplementation of MCHOSE HUB (M HUB)"
license = "MIT"
readme = "README.md"

[[bin]]
name = "mchose-hub-native"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = [
    "default_fonts",
    "glow",
    "x11",
    "wayland",
] }
egui = "0.31"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hidapi = "2.6"
crossbeam-channel = "0.5"
log = "0.4"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
libloading = "0.9"
raw-window-handle = "0.6"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_Audio_Apo",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
opt-level = 2
